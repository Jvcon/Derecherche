id: duckduckgo
name: DuckDuckGo
hosts:
  - duckduckgo.com
  - www.duckduckgo.com
urlParams: [q]
selectors:
  query:
    - 'input[name="q"]'
defaultCategory: web-general
capabilities: [url, dom, html]
mount:
  anchor: ['#header', 'input[name="q"]']
  rules:
    - container: '#header_wrapper'
      insert: after
    - container: '#header'
      insert: after
    - container: 'header'
      insert: after
    - anchor: ['input[name="q"]']
      insert: after
