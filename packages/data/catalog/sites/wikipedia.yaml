id: wikipedia
name: Wikipedia Search
hosts:
  - "*.wikipedia.org"
urlParams: [search]
selectors:
  query:
    - 'input[name="search"]'
    - '#searchInput'
defaultCategory: knowledge-encyclopedia
capabilities: [url, dom, html]
mount:
  anchor: ['#searchInput', 'input[name="search"]']
  rules:
    - container: 'header'
      insert: after
    - container: '#mw-content-text'
      insert: before
    - anchor: ['#searchInput', 'input[name="search"]']
      insert: after
