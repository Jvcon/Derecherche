id: google-images
name: Google Images
hosts:
  - www.google.com
  - google.com
  - "*.google.com"
pathPattern: "^/search$"
paramMatches:
  tbm: isch
urlParams: [q]
selectors:
  query:
    - 'input[name="q"]'
    - 'textarea[name="q"]'
defaultCategory: image-search
capabilities: [url, dom, html]
priority: 20
notes: More specific than the host-only google adapter; path and tbm must both match.
mount:
  anchor: ['#tsf', 'input[name="q"]']
  rules:
    - container: '#search'
      insert: before
    - container: '#top_nav'
      insert: after
    - anchor: ['#tsf', 'input[name="q"]']
      insert: after
