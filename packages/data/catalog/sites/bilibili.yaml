id: bilibili
name: 哔哩哔哩搜索
hosts:
  - search.bilibili.com
  - www.bilibili.com
urlParams: [keyword]
selectors:
  query:
    - 'input[name="keyword"]'
    - 'input[type="text"]'
defaultCategory: media-video
capabilities: [url, dom, html]
notes: Selector is best-effort; verify on both search and video pages.
mount:
  anchor: ['input[name="keyword"]', 'input[type="text"]']
  rules:
    - container: '.search-header'
      insert: after
    - container: '#biliMainHeader'
      insert: after
    - container: '.bili-header'
      insert: after
    - anchor: ['input[name="keyword"]', 'input[type="text"]']
      insert: after
