id: baidu
name: 百度搜索
hosts:
  - www.baidu.com
  - baidu.com
urlParams: [wd]
selectors:
  query:
    - '#kw'
    - 'input[name="wd"]'
defaultCategory: web-general
capabilities: [url, dom, html]
mount:
  anchor: ['#kw', 'input[name="wd"]']
  trim: ['#s_tab']
  rules:
    - container: '#head'
      insert: after
    - container: '#content_left'
      insert: before
    - anchor: ['#kw', 'input[name="wd"]']
      insert: after
notes: Baidu desktop responses were blocked by security verification during the automated live check; verify the mount selectors in a real browser.
