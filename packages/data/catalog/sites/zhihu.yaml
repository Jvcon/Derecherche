id: zhihu
name: 知乎搜索
hosts:
  - www.zhihu.com
  - zhihu.com
urlParams: [q]
selectors:
  query:
    - 'input[name="q"]'
    - 'input[type="text"]'
defaultCategory: knowledge-qa
capabilities: [url, dom, html]
notes: Selector is best-effort; verify against the current Zhihu search page.
mount:
  anchor: ['input[name="q"]', 'input[type="text"]']
  rules:
    - container: '.AppHeader'
      insert: after
    - container: 'header'
      insert: after
    - anchor: ['input[name="q"]', 'input[type="text"]']
      insert: after
