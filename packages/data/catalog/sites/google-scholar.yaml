id: google-scholar
name: Google Scholar
hosts:
  - scholar.google.com
urlParams: [q]
selectors:
  query:
    - 'input[name="q"]'
defaultCategory: academic-search
capabilities: [url, dom, html]
priority: 20
mount:
  anchor: ['#gs_hdr_tsi', 'input[name="q"]']
  rules:
    - container: '#gs_top'
      insert: after
    - anchor: ['#gs_hdr_tsi', 'input[name="q"]']
      insert: after
