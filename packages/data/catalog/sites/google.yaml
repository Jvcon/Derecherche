id: google
name: Google Search
hosts:
  - www.google.com
  - google.com
  - "*.google.com"
urlParams: [q]
selectors:
  query:
    - 'input[name="q"]'
    - 'textarea[name="q"]'
defaultCategory: web-general
capabilities: [url, dom, html]
notes: Google regional domains are matched by the wildcard host entry.
mount:
  anchor: ['#tsf', 'form[action*="/search"]', 'input[name="q"]']
  rules:
    - container: '#search'
      insert: before
    - container: '#gb'
      insert: after
    - anchor: ['#tsf', 'form[action*="/search"]', 'input[name="q"]']
      insert: after
