id: bing-images
name: Bing Images
hosts:
  - www.bing.com
  - cn.bing.com
  - bing.com
pathPattern: "^/images/search$"
urlParams: [q]
selectors:
  query:
    - '#sb_form_q'
    - 'input[name="q"]'
defaultCategory: image-search
capabilities: [url, dom, html]
priority: 20
notes: More specific than the host-only bing adapter.
mount:
  anchor: ['#sb_form', '#sb_form_q', 'input[name="q"]']
  rules:
    - container: '#b_header'
      insert: after
    - anchor: ['#sb_form', '#sb_form_q', 'input[name="q"]']
      insert: after
