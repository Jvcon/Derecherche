id: bing
name: Bing Search
hosts:
  - www.bing.com
  - cn.bing.com
  - bing.com
urlParams: [q]
selectors:
  query:
    - '#sb_form_q'
    - 'input[name="q"]'
defaultCategory: web-general
capabilities: [url, dom, html]
mount:
  anchor: ['#sb_form', '#sb_form_q', 'input[name="q"]']
  rules:
    - container: '#b_header'
      insert: after
    - container: '#b_results'
      insert: before
    - anchor: ['#sb_form', '#sb_form_q', 'input[name="q"]']
      insert: after
notes: Mount selectors were checked against live Bing result HTML on 2026-10-29.
