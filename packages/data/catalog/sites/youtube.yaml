id: youtube
name: YouTube Search
hosts:
  - www.youtube.com
  - youtube.com
  - m.youtube.com
urlParams: [search_query]
selectors:
  query:
    - 'input#search'
    - 'input[name="search_query"]'
defaultCategory: media-video
capabilities: [url, dom, html]
mount:
  anchor: ['input#search', 'input[name="search_query"]']
  rules:
    - container: '#masthead-container'
      insert: after
    - container: '#header'
      insert: after
    - anchor: ['input#search', 'input[name="search_query"]']
      insert: after
