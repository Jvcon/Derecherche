schemaVersion: 1
catalogVersion: "2026.10.0"

# Category taxonomy v1.
# Rules:
#   - At most two category levels: category -> subcategory.
#   - An engine has exactly one primary category; use tags for cross-discovery.
#   - Aim for at least three engines before a subcategory becomes visible.
#     Phase 0 may keep planned placeholders; the UI hides empty branches.
#   - Category ids are stable; display names may change.
